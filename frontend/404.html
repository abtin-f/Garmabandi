<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صفحه پیدا نشد | گرمابندی ساختمان</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="stylesheet" href="assets/fonts.css">
<script>(function(){try{var t=localStorage.getItem("tb_theme")||"light";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<style>
  /* dark theme (default variable set) */
  [data-theme="dark"]{
    --bg:#06080d; --bg2:#0c0f16; --bg3:#12161f; --card:#0e1219;
    --text:#edeae3; --muted:#88847f; --faint:#484440;
    --rim:rgba(255,255,255,.08); --rim2:rgba(255,255,255,.14);
  }
  /* light theme */
  [data-theme="light"]{
    --bg:#eef0f3; --bg2:#e5e8ec; --bg3:#dce0e6; --card:#fff;
    --text:#1b1e26; --muted:#5e6270; --faint:#a0a4ae;
    --rim:rgba(0,0,0,.065); --rim2:rgba(0,0,0,.1);
  }
  :root{
    --gold:#d49210; --gold2:#b87a08; --goldL:#f0b030;
    --f:'Vazirmatn',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text); font-family:var(--f);
    direction:rtl; display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:1.5rem; overflow-x:hidden;
    background-image:radial-gradient(ellipse 60% 50% at 50% 0%,rgba(212,146,10,.08),transparent 70%);
  }
  .wrap{ text-align:center; max-width:480px; width:100%; }

  /* عدد بزرگ ۴۰۴ */
  .code{
    font-size:clamp(6rem,22vw,11rem); font-weight:900; line-height:1;
    background:linear-gradient(145deg,var(--gold),var(--goldL));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    letter-spacing:.02em; margin-bottom:.3rem;
    text-shadow:0 8px 40px rgba(212,146,10,.18);
  }
  .icon-badge{
    width:60px; height:60px; margin:0 auto 1.4rem;
    border-radius:16px; background:rgba(212,146,10,.12);
    border:1px solid rgba(212,146,10,.25);
    display:flex; align-items:center; justify-content:center;
  }
  .icon-badge svg{ width:28px; height:28px; stroke:var(--gold); }

  h1{ font-size:clamp(1.2rem,4vw,1.6rem); font-weight:800; margin-bottom:.7rem; }
  p{ font-size:.95rem; line-height:1.9; color:var(--muted); margin-bottom:1.8rem; }

  .actions{ display:flex; gap:.7rem; justify-content:center; flex-wrap:wrap; }
  .btn{
    display:inline-flex; align-items:center; gap:.45rem;
    padding:.8rem 1.5rem; border-radius:11px; font-family:var(--f);
    font-size:.9rem; font-weight:700; cursor:pointer; text-decoration:none;
    border:1px solid transparent; transition:transform .15s,background .2s;
  }
  .btn:hover{ transform:translateY(-2px); }
  .btn-gold{
    background:linear-gradient(145deg,var(--gold),var(--gold2));
    color:#fff; box-shadow:0 6px 20px rgba(212,146,10,.3);
  }
  .btn-ghost{ background:var(--bg3); color:var(--text); border-color:var(--rim2); }
  .btn-ghost:hover{ background:var(--bg2); }
  .btn svg{ width:16px; height:16px; }

  .links{ margin-top:2rem; font-size:.82rem; color:var(--faint); }
  .links a{ color:var(--muted); text-decoration:none; }
  .links a:hover{ color:var(--goldL); }

  @media(max-width:480px){
    .actions{ flex-direction:column; }
    .btn{ width:100%; justify-content:center; }
  }
</style>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="گرمابندی">
<meta name="robots" content="noindex, nofollow">
</head>
<body>
  <div class="wrap">
    <div class="icon-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        <line x1="8" y1="11" x2="14" y2="11"></line>
      </svg>
    </div>

    <div class="code">۴۰۴</div>
    <h1>این صفحه پیدا نشد</h1>
    <p>
      صفحه‌ای که دنبالش هستید وجود ندارد یا جابه‌جا شده است.
      ممکن است آدرس را اشتباه وارد کرده باشید.
    </p>

    <div class="actions">
      <a href="/index.html" class="btn btn-gold">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        بازگشت به خانه
      </a>
      <a href="/shop.html" class="btn btn-ghost">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        فروشگاه
      </a>
    </div>

    <div class="links">
      نیاز به کمک دارید؟ <a href="/contact.html">با ما تماس بگیرید</a>
    </div>
  </div>
</body>
</html>
